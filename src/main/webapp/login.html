
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Login | Expense Reimbursement System</title>

    <link rel="stylesheet" href="style.css?v=12346">
</head>

<body>

    <!-- Header -->
    <header class="main-header">
        <h1>Claim Management System</h1>
    </header>

    <!-- Navigation -->
    <nav class="main-nav">
        <a href="login.html" class="active">Login</a>
    </nav>

    <!-- Main Content -->
    <main class="page-content">

        <h2 class="page-title">Employee Login</h2>

        <form action="login" method="post" class="login-form">

            <div class="form-group">
                <label for="employee_code">Employee Code</label>

                <input
                    type="number"
                    id="employee_code"
                    name="employee_code"
                    placeholder="Enter Employee Code"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter Password"
                    required
                >
            </div>

            <p id="error" class="error"></p>

            <button type="submit" class="btn">
                Login
            </button>

        </form>

    </main>

    <!-- Footer -->
    <footer class="main-footer">
        © 2026 Expense Reimbursement System. All rights reserved.
    </footer>

    <!-- Login Error Handling -->
    <script>
        const params = new URLSearchParams(window.location.search);

        if (params.get("error") === "invalid") {
            document.getElementById("error").textContent =
                "Invalid Employee Code or Password";
        }
    </script>

</body>
</html>
